# Local infrastructure for running the samples (Test.Aggregates / Test.Projections)
#   start:       docker compose up -d
#   stop:        docker compose down
#   wipe data:   docker compose down -v
#
# KurrentDB UI:       http://localhost:2113
# RavenDB Studio:     http://localhost:8080
name: rosetta

services:
  kurrentdb:
    image: kurrentplatform/kurrentdb:26.2
    environment:
      KURRENTDB_INSECURE: "true"
      KURRENTDB_RUN_PROJECTIONS: All                # Rosetta deploys Custom (cp-) JS projections
      KURRENTDB_START_STANDARD_PROJECTIONS: "true"  # $by_category feeds the $ce-* streams Projections subscribe to
      KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP: "true"   # read and append events over HTTP (curl); deprecated, still in 26.2
    ports:
      - "2113:2113"
    volumes:
      - kurrentdb-data:/var/lib/kurrentdb
      - kurrentdb-logs:/var/log/kurrentdb

  ravendb:
    image: ravendb/ravendb:7.2-latest
    environment:
      RAVEN_Setup_Mode: None
      RAVEN_License_Eula_Accepted: "true"
      RAVEN_Security_UnsecuredAccessAllowed: PublicNetwork
      RAVEN_ServerUrl: http://0.0.0.0:8080
      RAVEN_PublicServerUrl: http://localhost:8080
      RAVEN_ServerUrl_Tcp: tcp://0.0.0.0:38888
      RAVEN_PublicServerUrl_Tcp: tcp://localhost:38888
    ports:
      - "8080:8080"
      - "38888:38888"
    volumes:
      - ravendb-data:/var/lib/ravendb/data

volumes:
  kurrentdb-data:
  kurrentdb-logs:
  ravendb-data:
